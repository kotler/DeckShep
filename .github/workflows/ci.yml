name: CI
on:
  pull_request:
  push:
    branches: [main, refactor/v2-foundation]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run deps
      - run: npm run version:check
      - run: npm run compatibility:check
      - run: npm run marketplace:media && npm run marketplace:check
      - run: npm run test:coverage
      - run: npm run test:bundled
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Commit conventions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/tool.mjs @commitlint/cli --from "$BASE_SHA" --to "$HEAD_SHA"
      - run: npm run build -- --universal
      - run: node scripts/tool.mjs @elgato/cli validate dist/com.kotl3r.deckshep.sdPlugin --no-update-check
      - run: npm run package -- --skip-build
      - uses: actions/upload-artifact@v7
        with:
          name: verified-beta
          path: |
            dist/deckshep-*-macos.zip
            dist/*.sha256
            dist/SHA256SUMS

  e2e:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        name: Read locked browser tool version
        run: node -e "const fs=require('node:fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json')); console.log('version='+lock.packages['tools/node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - run: npm run e2e:install
      - run: npm audit --audit-level=high
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: virtual-deck-macos-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Temporary platform calibration; retain macOS until Linux output is reviewed.
  e2e-linux-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        name: Read locked browser tool version
        run: node -e "const fs=require('node:fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json')); console.log('version='+lock.packages['tools/node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - run: npm run e2e:install
      - run: npm run test:e2e:update
      - run: npm run test:e2e
      - name: Compare platform PNGs
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const directory = 'tests/e2e/__screenshots__/';
          const files = fs.readdirSync(directory).filter(name => name.endsWith('-linux.png'));
          if (files.length !== 6) throw Error('Expected six Linux smoke images');
          const different = files.filter(name => !fs.readFileSync(directory + name).equals(fs.readFileSync(directory + name.replace('-linux.png', '-darwin.png'))));
          const message = `Linux fixture checks passed with six own baselines; ${different.length}/6 PNGs differ from macOS. Keep macOS pending platform review.\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message);
          console.log(message);
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: virtual-deck-linux-trial
          path: |
            tests/e2e/__screenshots__/*-linux.png
            playwright-report/
            test-results/
          retention-days: 7
