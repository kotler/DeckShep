<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeckShep virtual deck</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10151b;
        color: #f3f6fa;
      }
      body {
        margin: 0;
        padding: 32px;
        max-width: 1100px;
        margin-inline: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        color: #a9b9c7;
        line-height: 1.5;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 24px 0;
      }
      select,
      button {
        color: inherit;
        font: inherit;
        background: #222d39;
        border: 1px solid #465465;
        border-radius: 8px;
        padding: 8px 12px;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #91c7ff;
      }
      #deck {
        display: grid;
        grid-template-columns: repeat(5, 144px);
        gap: 14px;
        background: #05080c;
        padding: 22px;
        border: 1px solid #394552;
        border-radius: 24px;
        width: max-content;
        box-shadow: 0 14px 45px #0007;
      }
      .key {
        width: 144px;
        height: 144px;
        padding: 0;
        border: 0;
        background: #18212c;
        border-radius: 16px;
        position: relative;
        touch-action: none;
        overflow: hidden;
      }
      .key img {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      .key span {
        position: absolute;
        inset: 50% 0 auto;
        text-align: center;
        font: 18px Arial;
        pointer-events: none;
        white-space: pre-line;
      }
      .key[data-visible='false'] {
        opacity: 0.3;
      }
      #trace {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #17202a;
        border-radius: 12px;
        padding: 16px;
        min-height: 60px;
      }
      small {
        color: #a9b9c7;
      }
      @media (max-width: 850px) {
        body {
          padding: 16px;
        }
        #deck {
          grid-template-columns: repeat(5, minmax(0, 1fr));
          width: auto;
          gap: 8px;
          padding: 12px;
        }
        .key {
          width: 100%;
          height: auto;
          aspect-ratio: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>DeckShep</h1>
        <p>Virtual deck · synthetic agents only</p>
      </div>
      <small id="status" role="status">Connecting…</small>
    </header>
    <div class="controls">
      <label
        >Profile
        <select id="profile" data-testid="profile">
          <option value="rex">Rex</option>
          <option value="herdr">Herdr</option>
        </select></label
      ><label
        >Scenario
        <select id="scenario" data-testid="scenario"></select></label
      ><button id="advance">Advance 500 ms</button
      ><button id="consent">Enable fixture consent</button
      ><button id="claude">Enable fixture Claude</button
      ><button id="reset">Reset</button>
    </div>
    <main>
      <div id="deck" data-testid="deck" aria-label="Virtual Stream Deck"></div>
      <p>
        Click keys to exercise the bundled plugin. Time advances only with the
        control above. Settings apply to this disposable fixture.
      </p>
      <h2>Input trace and alerts</h2>
      <pre id="trace" data-testid="trace"></pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
